# Core server settings
server.port=8080

# Load local .env values during IDE runs (optional, no failure if missing)
spring.config.import=optional:file:.env[.properties]

# PostgreSQL connection (use environment variables, no secrets in source control)
# Local example:
#   POSTGRES_URL=jdbc:postgresql://localhost:5432/currently_db
#   POSTGRES_USER=currently_user
#   POSTGRES_PASSWORD=<your_real_password_here>
# Or standard Spring env vars:
#   SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/currently_db
#   SPRING_DATASOURCE_USERNAME=currently_user
# Never fall back to in-file secrets; fail fast if required env vars are missing.
spring.datasource.url=${SPRING_DATASOURCE_URL:${POSTGRES_URL:?POSTGRES_URL is required when SPRING_DATASOURCE_URL is not set}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:?POSTGRES_USER is required when SPRING_DATASOURCE_USERNAME is not set}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required when SPRING_DATASOURCE_PASSWORD is not set}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Keep only one active profile at startup.
# - dev: auto schema updates for local development
# - prod: strict validation against migration-managed schema
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Disable OpenEntityManagerInView to avoid accidental data over-fetching leaks
spring.jpa.open-in-view=false

# JPA defaults (PostgreSQL auto-detects the dialect in modern versions)
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

# JWT defaults; set JWT_SECRET in production (Base64-encoded, 32+ byte key)
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Field encryption and lookup hash keys (Base64, 32-byte minimum)
app.data.encryption-key=${APP_DATA_ENCRYPTION_KEY:}
app.data.hash-key=${APP_DATA_HASH_KEY:}

# Basic API abuse protection for sensitive endpoints
security.rate-limit.max-requests=${RATE_LIMIT_MAX_REQUESTS:30}
security.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}
